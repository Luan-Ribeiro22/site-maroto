<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login | Pratopronto</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="section">
    <div class="wrapper">
      <h2>Entrar</h2>
      <form class="contact-card" action="/login" method="POST">
        <label>Email</label>
        <input type="email" name="email" required>
        <label>Senha</label>
        <input type="password" name="senha" required>
        <button class="button button--primary" type="submit">Login</button>
      </form>
    </div>
  </main>
</body>
</html>
